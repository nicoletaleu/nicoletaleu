name: Trophies

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ryo-ma/github-profile-trophy@43736b5
        with:
          username: nicoletaleu
          output_path: trophies.svg
          token: ${{ secrets.METRICS_TOKEN }}
          theme: tokyonight

      - name: Commit the image if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophies.svg
          git diff --cached --quiet || (git commit -m "Update trophies" && git push)
